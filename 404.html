<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --white: #ffffff;
      --cream: #fff7dc;
      --gold: #ffd66b;
      --blue-dark: #314174;
      --text: #fffdf5;
      --shadow: rgba(23, 45, 96, 0.35);
      --glass-border: rgba(255, 255, 255, 0.38);
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% 15%, rgba(255, 244, 194, 0.95) 0%, rgba(255, 220, 133, 0.35) 16%, transparent 34%),
        linear-gradient(180deg, #7ac8ff 0%, #8cb7ff 38%, #9e85dc 73%, #f0b86f 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background:
        radial-gradient(circle at 15% 22%, rgba(255,255,255,0.75) 0 2px, transparent 3px),
        radial-gradient(circle at 72% 18%, rgba(255,255,255,0.75) 0 2px, transparent 3px),
        radial-gradient(circle at 84% 42%, rgba(255,255,255,0.7) 0 1.5px, transparent 3px),
        radial-gradient(circle at 28% 50%, rgba(255,255,255,0.55) 0 1.5px, transparent 3px),
        radial-gradient(circle at 50% 75%, rgba(255,255,255,0.45) 0 1px, transparent 2px);
      opacity: 0.9;
      animation: sparkle 5s ease-in-out infinite alternate;
    }

    body::after {
      background:
        linear-gradient(115deg, transparent 0 38%, rgba(255, 250, 210, 0.22) 39%, transparent 48%),
        linear-gradient(65deg, transparent 0 44%, rgba(255, 250, 210, 0.16) 45%, transparent 54%);
      mix-blend-mode: screen;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 18px;
    }

    .cloud {
      position: fixed;
      z-index: 0;
      width: 260px;
      height: 80px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.42);
      filter: blur(1px);
      box-shadow:
        55px 18px 0 rgba(255, 255, 255, 0.34),
        105px -7px 0 rgba(255, 255, 255, 0.28),
        145px 20px 0 rgba(255, 255, 255, 0.24);
      animation: floatCloud 18s ease-in-out infinite alternate;
    }

    .cloud.one {
      top: 14%;
      left: -80px;
    }

    .cloud.two {
      right: -120px;
      bottom: 18%;
      transform: scale(1.25);
      animation-duration: 22s;
    }

    .card {
      position: relative;
      width: min(840px, 100%);
      padding: clamp(30px, 6vw, 64px);
      text-align: center;
      border: 1px solid var(--glass-border);
      border-radius: 34px;
      background: linear-gradient(180deg, rgba(255,255,255,0.26), rgba(255,255,255,0.12));
      box-shadow: 0 30px 90px var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      background: radial-gradient(circle at 50% 0%, rgba(255, 236, 164, 0.5), transparent 42%);
      pointer-events: none;
    }

    .error-code {
      position: relative;
      margin-bottom: 14px;
      font-size: clamp(82px, 20vw, 180px);
      line-height: 0.9;
      font-weight: 900;
      letter-spacing: -0.08em;
      color: var(--cream);
      text-shadow:
        0 10px 34px rgba(45, 67, 130, 0.42),
        0 0 34px rgba(255, 238, 168, 0.55);
    }

    h1 {
      position: relative;
      margin-bottom: 18px;
      font-size: clamp(28px, 5.5vw, 54px);
      line-height: 1.08;
      letter-spacing: -0.04em;
      text-shadow: 0 8px 28px rgba(45, 67, 130, 0.35);
    }

    .description {
      position: relative;
      max-width: 680px;
      margin: 0 auto;
      font-size: clamp(17px, 2.4vw, 22px);
      line-height: 1.65;
      color: rgba(255, 253, 245, 0.96);
      text-shadow: 0 2px 16px rgba(36, 56, 116, 0.32);
    }

    .buttons {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 36px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 220px;
      min-height: 58px;
      padding: 16px 24px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.55);
      color: var(--blue-dark);
      background: linear-gradient(180deg, #fff7d8, #ffd66b);
      box-shadow: 0 14px 32px rgba(122, 92, 28, 0.24);
      font-size: 17px;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
    }

    .button:hover,
    .button:focus-visible {
      transform: translateY(-4px);
      box-shadow: 0 18px 42px rgba(122, 92, 28, 0.34);
      filter: brightness(1.04);
    }

    .button.secondary {
      color: var(--white);
      background: rgba(255, 255, 255, 0.16);
      box-shadow: 0 14px 32px rgba(37, 58, 124, 0.22);
    }

    .button.secondary:hover,
    .button.secondary:focus-visible {
      background: rgba(255, 255, 255, 0.24);
    }

    .floating-light {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--cream);
      box-shadow: 0 0 24px 10px rgba(255, 244, 188, 0.55);
      opacity: 0.9;
      animation: floatLight 4.5s ease-in-out infinite alternate;
    }

    .floating-light.a {
      top: 18%;
      left: 13%;
    }

    .floating-light.b {
      right: 14%;
      bottom: 20%;
      width: 12px;
      height: 12px;
      animation-delay: 1.2s;
    }

    .floating-light.c {
      left: 50%;
      bottom: 10%;
      width: 10px;
      height: 10px;
      animation-delay: 0.6s;
    }

    .hills {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 0;
      height: 26vh;
      min-height: 150px;
      background:
        radial-gradient(120% 95% at 18% 100%, rgba(96, 148, 175, 0.5) 0 45%, transparent 46%),
        radial-gradient(110% 90% at 78% 110%, rgba(88, 119, 172, 0.48) 0 50%, transparent 51%),
        linear-gradient(180deg, transparent, rgba(71, 79, 140, 0.24));
    }

    @keyframes sparkle {
      from { opacity: 0.45; }
      to { opacity: 1; }
    }

    @keyframes floatCloud {
      from { transform: translateX(0); }
      to { transform: translateX(42px); }
    }

    @keyframes floatLight {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(-22px) scale(1.15); }
    }

    @media (max-width: 640px) {
      .page {
        align-items: flex-start;
        padding: 28px 14px 120px;
      }

      .card {
        margin-top: 34px;
        padding: 34px 18px;
        border-radius: 26px;
      }

      .error-code {
        font-size: clamp(76px, 28vw, 120px);
      }

      h1 {
        font-size: clamp(25px, 8vw, 34px);
      }

      .description {
        font-size: 16px;
        line-height: 1.62;
      }

      .buttons {
        flex-direction: column;
        gap: 14px;
        margin-top: 30px;
      }

      .button {
        width: 100%;
        min-width: 0;
        min-height: 56px;
        font-size: 16px;
      }

      .cloud {
        opacity: 0.55;
        transform: scale(0.72);
      }

      .cloud.two {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="cloud one"></div>
  <div class="cloud two"></div>
  <div class="hills"></div>

  <main class="page">
    <section class="card" aria-labelledby="page-title">
      <div class="floating-light a"></div>
      <div class="floating-light b"></div>
      <div class="floating-light c"></div>

      <div class="error-code">404</div>

      <h1 id="page-title">Посилання не знайдено</h1>

      <p class="description">
        Схоже, ви помилилися з посиланням або це посилання вже не дійсне.
        Перевірте адресу сторінки або скористайтеся актуальним посиланням на Discord-спільноту
        «Небо: Діти Світла UA».
      </p>

      <div class="buttons" aria-label="Навігація сторінки 404">
        <a class="button" href="http://d.scl.pp.ua/">
          Актуальне запрошення
        </a>

        <a class="button secondary" href="https://d.scl.pp.ua/info/">
          Повернутися назад
        </a>
      </div>
    </section>
  </main>
</body>
</html>
